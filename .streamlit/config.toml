# "Four regimes" theme: each sleeve owns the colour of the economic season it protects against, and the
# Permanent Portfolio has its own magenta. Chart palettes are validated for colour-blind safety in both modes.

[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 600, 600]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#b03f86"
backgroundColor = "#f7f8f6"
secondaryBackgroundColor = "#eef1ee"
textColor = "#17201b"
linkColor = "#8f2f6c"
borderColor = "#dfe4df"
chartCategoricalColors = ["#b03f86", "#2f7fd0", "#3a9a4b", "#b07d0a", "#8a63d2"]
dataframeBorderColor = "#dfe4df"
dataframeHeaderBackgroundColor = "#eef1ee"

[theme.dark]
primaryColor = "#c75298"
backgroundColor = "#15181a"
secondaryBackgroundColor = "#1c2023"
textColor = "#eaeeea"
linkColor = "#e08bbd"
borderColor = "#2b3133"
chartCategoricalColors = ["#c75298", "#4a8ee0", "#3f9f50", "#b98008", "#8e6fe0"]
dataframeBorderColor = "#2b3133"
dataframeHeaderBackgroundColor = "#1c2023"

[browser]
gatherUsageStats = false
